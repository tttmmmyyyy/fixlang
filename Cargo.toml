[package]
name = "fixlang"
version = "1.5.0"
edition = "2021"
license = "MIT"

[dependencies]
once_cell = "1.13.0"
# The LLVM release the compiler links. Five other places name it -- the prefix `clang_path` in
# `src/build/build.rs` reads (`LLVM_SYS_221_PREFIX`, whose name carries this same version), the two
# workflows that install it, and the installation instructions of both manuals --
# and `test_every_place_naming_llvm_names_the_release_the_project_file_pins` holds them together.
inkwell = { version = "0.10.0", features = ["llvm22-1"] }
either = "1.7.0"
pest = "2.3.0"
pest_derive = "2.2"
libloading = "0.7"
clap = { version = "3.2.0", default-features = false, features = ["std", "suggestions"] }
md5 = "0.7.0"
serde = { version = "1.0.164", features = ["rc", "derive"] }
serde_json = "1.0.97"
build-time = "0.1.3"
chrono = "0.4.26"
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
regex = "1.9.3"
rand = "0.8.6"
num-bigint = "0.4.4"
lsp-types = "0.97.0"
toml = "0.8.19"
difference = "0.4"
semver = "1.0.23"
git2 = "0.20.4"
tempfile = "3.12.0"
reqwest = { version = "0.12", features = ["blocking"] }
num_cpus = "1.16.0"
dirs = "5.0.1"
fxhash = "0.2.1"
urlencoding = "2.1.3"
colored = "2.1.0"
git-version = "0.3.9"
mimalloc = "0.1.48"
stacker = "0.1"
typetag = "0.2"
dyn-clone = "1.0"

[lib]
name = "fixlang"
path = "src/lib.rs"

[[bin]]
name = "fix"
path = "src/main.rs"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "typecheck"
harness = false
