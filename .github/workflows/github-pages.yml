name: GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Assemble the site
        run: |
          mkdir -p _site/benchmark
          cp -r third-party-licenses/. _site/
          python3 -m pip install --quiet markdown
          python3 benchmark/speedtest/graph_html.py --out _site/benchmark/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4