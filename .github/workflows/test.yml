name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `ubuntu-24.04-arm` runs AArch64 Linux, the one runner whose C ABI leaves the bits above a
        # narrow integer to the reader.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        opt-level: [max, basic, none]
    env:
      FIX_MAX_OPT_LEVEL: ${{ matrix.opt-level }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            if [[ "${{ runner.arch }}" == "ARM64" ]]; then LLVM_ARCH=ARM64; else LLVM_ARCH=X64; fi
            LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-${LLVM_ARCH}.tar.xz"
            mkdir -p llvm
            wget -q "$LLVM_URL" -O llvm.tar.xz
            tar -xf llvm.tar.xz -C llvm --strip-components=1
            LLVM_PATH="${GITHUB_WORKSPACE}/llvm"
            echo "LLVM_SYS_221_PREFIX=$LLVM_PATH" >> $GITHUB_ENV
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install llvm@22
            echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y libgmp-dev libmpfr-dev lldb
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install openssl
            echo "OPENSSL_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV
            brew install gmp
            brew install mpfr
            echo "LIBRARY_PATH=/opt/homebrew/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          fi

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install valgrind (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y valgrind=1:3.22.*

      - name: Run tests
        run: cargo test --release -- --skip tests::test_thread_safety

  # ThreadSanitizer instruments every memory access, so a program built with it runs several times
  # slower. Only the tests that share a value between threads have a race to find, so only they are
  # built that way; every other test runs in the `test` job.
  #
  # These tests name the optimization levels they build at, one of them `none` and one `max`, and
  # `FIX_MAX_OPT_LEVEL` caps the level a build may reach, so this job leaves it unset and each test
  # runs at the level it asks for.
  thread-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-Linux-X64.tar.xz"
          mkdir -p llvm
          wget -q "$LLVM_URL" -O llvm.tar.xz
          tar -xf llvm.tar.xz -C llvm --strip-components=1
          echo "LLVM_SYS_221_PREFIX=${GITHUB_WORKSPACE}/llvm" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev lldb

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run the thread safety tests
        run: cargo test --release tests::test_thread_safety
