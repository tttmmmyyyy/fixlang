name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        opt-level: [max, basic, none]
    env:
      FIX_MAX_OPT_LEVEL: ${{ matrix.opt-level }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
            mkdir -p llvm
            wget -q "$LLVM_URL" -O llvm.tar.xz
            tar -xf llvm.tar.xz -C llvm --strip-components=1
            LLVM_PATH="${GITHUB_WORKSPACE}/llvm"
            echo "LLVM_SYS_170_PREFIX=$LLVM_PATH" >> $GITHUB_ENV
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install llvm@17
            echo "LLVM_SYS_170_PREFIX=$(brew --prefix llvm@17)" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y libgmp-dev libmpfr-dev lldb
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install openssl
            echo "OPENSSL_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV
            brew install gmp
            brew install mpfr
            echo "LIBRARY_PATH=/opt/homebrew/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          fi

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install valgrind (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y valgrind=1:3.22.*

      - name: Run tests
        run: cargo test --release -- --skip tests::test_thread_safety

  # ThreadSanitizer instruments every memory access, so a program built with it runs several times
  # slower. Only the tests that share a value between threads have a race to find, so only they are
  # built that way; every other test runs in the `test` job.
  #
  # These tests name the optimization levels they build at, one of them `none` and one `max`, and
  # `FIX_MAX_OPT_LEVEL` caps the level a build may reach, so this job leaves it unset and each test
  # runs at the level it asks for.
  thread-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM
        shell: bash
        run: |
          LLVM_URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz"
          mkdir -p llvm
          wget -q "$LLVM_URL" -O llvm.tar.xz
          tar -xf llvm.tar.xz -C llvm --strip-components=1
          echo "LLVM_SYS_170_PREFIX=${GITHUB_WORKSPACE}/llvm" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev lldb

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Run the thread safety tests
        run: cargo test --release tests::test_thread_safety
